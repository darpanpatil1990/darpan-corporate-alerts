name: Check Free Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test Screener and ScanX
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import re
          import html

          sources = [
              ("Screener", "https://www.screener.in/company/HFCL/consolidated/"),
              ("ScanX", "https://scanx.trade/stock-market-news/orders-deals"),
          ]

          passed = 0

          for name, url in sources:
              print("\nSOURCE:", name, flush=True)
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      page = response.read().decode("utf-8", errors="replace")
                      print("HTTP:", response.status)

                  if name == "Screener":
                      section = re.search(
                          r'<section\b[^>]*id=["\x27]quarters["\x27][^>]*>(.*?)</section>',
                          page, re.S | re.I
                      )
                      if not section:
                          raise ValueError("Quarterly results table not found")

                      rows = re.findall(
                          r"<tr\b[^>]*>(.*?)</tr>",
                          section.group(1), re.S | re.I
                      )
                      if not rows:
                          raise ValueError("Result rows missing")

                      for row in rows[:6]:
                          text = re.sub(r"<[^>]+>", " ", row)
                          print(html.unescape(" ".join(text.split())))

                      print("PASS: Quarterly result rows accessible")

                  else:
                      links = re.findall(
                          r'href=["\x27]([^"\x27]+)["\x27]',
                          page, re.I
                      )
                      articles = list(dict.fromkeys(
                          link for link in links
                          if "/stock-market-news/" in link
                          and len(link.split("/")) >= 5
                      ))
                      if not articles:
                          raise ValueError("Article links not found")

                      print("Article links found:", len(articles))
                      for link in articles[:5]:
                          print(html.unescape(link))

                      print("PASS: News links accessible")

                  passed += 1

              except Exception as error:
                  print("FAIL:", type(error).__name__, str(error))

          print("\nSources passed:", passed, "of", len(sources))
          if passed != len(sources):
              raise SystemExit(1)
          PY
