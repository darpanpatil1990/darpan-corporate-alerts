name: Check Screener Login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check announcements access
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import http.cookiejar
          import urllib.request
          import urllib.parse
          import urllib.error
          from html.parser import HTMLParser

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.csrf = ""
                  self.links = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "input":
                      if attrs.get("name") == "csrfmiddlewaretoken":
                          self.csrf = attrs.get("value", "")
                  if tag == "a":
                      self.current = [attrs.get("href", ""), ""]

              def handle_data(self, data):
                  if self.current is not None:
                      self.current[1] += data

              def handle_endtag(self, tag):
                  if tag == "a" and self.current is not None:
                      self.links.append(self.current)
                      self.current = None

