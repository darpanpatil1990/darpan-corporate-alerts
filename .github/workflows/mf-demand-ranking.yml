name: MF Demand Zone Fund Ranking
on:
  push:
    branches: [main]
    paths:
      - 'mf_fund_ranker.py'
      - 'test_mf_fund_ranker.py'
      - '.github/workflows/mf-demand-ranking.yml'
  workflow_dispatch:
  schedule:
    # 17:50 IST on Indian weekdays. External data may be delayed.
    - cron: '20 12 * * 1-5'
  pull_request:
    paths:
      - 'mf_fund_ranker.py'
      - 'test_mf_fund_ranker.py'
      - '.github/workflows/mf-demand-ranking.yml'
permissions:
  contents: read
concurrency:
  group: mf-demand-ranking-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate category filters and ranking logic
        run: python -m unittest -v test_mf_fund_ranker.py
  rank:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .scanner-cache/mf-ranker
          key: mf-ranker-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mf-ranker-${{ runner.os }}-
      - name: Rank all ScanX equity schemes excluding ELSS, arbitrage and defensive funds
        run: python mf_fund_ranker.py --workers 4 --output mf-ranking-output
      - name: Upload research results even if coverage is partial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-demand-ranking-${{ github.run_id }}
          path: mf-ranking-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve public ScanX cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .scanner-cache/mf-ranker
          key: mf-ranker-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
