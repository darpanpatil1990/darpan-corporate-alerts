name: Check Screener Login
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check announcements access
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
        shell: python
        run: |
          import os, re, http.cookiejar
          import urllib.request as w
          import urllib.parse as p
          email = os.environ["SCREENER_EMAIL"].strip()
          password = os.environ["SCREENER_PASSWORD"]
          assert email and password, "Screener secrets missing"
          base = "https://www.screener.in"
          client = w.build_opener(w.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          client.addheaders = [("User-Agent", "Mozilla/5.0")]
          with client.open(base + "/login/", timeout=25) as r:
              page = r.read().decode()
          token = re.search(r'name="csrfmiddlewaretoken"\s+value="([^"]+)"', page)
          assert token, "Login form token missing"
          data = p.urlencode({"username": email, "password": password, "csrfmiddlewaretoken": token.group(1), "next": "/announcements/"}).encode()
          request = w.Request(base + "/login/", data=data, headers={"Referer": base + "/login/"})
          with client.open(request, timeout=25) as r:
              r.read()
          with client.open(base + "/announcements/", timeout=25) as r:
              path = p.urlparse(r.url).path
              page = r.read().decode()
          assert path == "/announcements/", "Login not confirmed"
          assert "Latest Announcements" in page, "Announcements not confirmed"
          print("SUCCESS: Screener login and announcements work")
# END
