name: Institutional Demand Alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'
permissions:
  contents: write
concurrency:
  group: institutional-demand-alerts
  cancel-in-progress: false
jobs:
  confluence:
    name: Institutional buying and HTF demand
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install parsers
        run: pip install beautifulsoup4==4.14.3 openpyxl==3.1.5 xlrd==2.0.2
      - name: Verify evidence matching
        run: python -m unittest test_institutional_confluence.py test_company_holdings.py
      - name: Scan and deliver dated confluence alerts
        run: python institutional_confluence.py
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.INSTITUTIONAL_PRIVATE_CHAT_ID }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          CONFLUENCE_BATCH_SIZE: '12'
