name: Check Market Pulse
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
    - name: Install HTML reader
      run: python -m pip install --quiet beautifulsoup4==4.14.3
    - name: Check all Market Pulse sections
      env:
        SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
        SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      shell: python
      run: "\"\"\"Read-only Screener access/layout check. Never prints credentials or cookies.\"\"\"\nimport http.cookiejar\nimport json\nimport os\nimport time\nimport urllib.error\nimport urllib.parse as url\nimport urllib.request as web\nfrom bs4 import BeautifulSoup\n\nBASE = 'https://www.screener.in'\nSOURCES = [\n    ('Bulk Deals', '/trades/bulk/?o=-2'),\n    ('Block Deals', '/trades/block/?o=-2'),\n    ('SAST Trades', '/trades/sast/?o=-2'),\n    ('Insider Trades', '/trades/insiders/?o=-2'),\n    ('Bonus', '/actions/bonus/?o=-1'),\n    ('Rights', '/actions/right/?o=-1'),\n    ('Split', '/actions/split/?o=-1'),\n    ('Buyback', '/actions/buyback/?o=-1'),\n    ('Dividend', '/actions/dividend/?o=-1'),\n    ('Concalls', '/concalls/'),\n    ('Upcoming Concalls', '/concalls/upcoming/'),\n    ('Annual Reports', '/annual-reports/'),\n    ('Upcoming Results', '/upcoming-results/'),\n    ('FII Investment', '/fii/'),\n]\n\n\ndef describe(page):\n    soup = BeautifulSoup(page, 'html.parser')\n    main = soup.find('main') or soup\n    title = main.find('h1')\n    result = {'title': title.get_text(' ', strip=True) if title else '', 'tables': []}\n    for table in main.select('table')[:3]:\n        headings = [h.get_text(' ', strip=True) for h in table.select('thead th')]\n        rows = []\n        for tr in table.select('tbody tr'):\n            cells = tr.find_all(['td', 'th'], recursive=False)\n            if cells:\n                rows.append([c.get_text(' ', strip=True)[:300] for c in cells])\n        result['tables'].append({'id': table.get('id', ''), 'headers': headings,\n                                'rows': len(rows), 'sample': rows[:2]})\n    # Document links are public filings, not account/session links.\n    docs = []\n    for a in main.select('a[href]'):\n        target = url.urljoin(BASE, a['href'])\n        p = url.urlparse(target)\n        host = p.hostname or ''\n        if p.scheme != 'https' or not any(host == d or host.endswith('.' + d)\n                for d in ('bseindia.com', 'nseindia.com', 'screener.in')):\n            continue\n        if '.pdf' in target.lower() or 'downloadattach' in target.lower():\n            docs.append({'title': a.get_text(' ', strip=True)[:180], 'url': target})\n    result['documents'] = len(docs)\n    result['sample_documents'] = docs[:2]\n    result['company_links'] = len(main.select('a[href*=\"/company/\"]'))\n    result['empty_message'] = any(t in main.get_text(' ', strip=True).lower()\n        for t in ('no results found', 'no records found', 'no results to show'))\n    return result\n\n\ndef main():\n    email = os.environ.get('SCREENER_EMAIL', '').strip()\n    password = os.environ.get('SCREENER_PASSWORD', '')\n    if not email or not password:\n        raise RuntimeError('SCREENER_EMAIL or SCREENER_PASSWORD secret missing')\n    client = web.build_opener(web.HTTPCookieProcessor(http.cookiejar.CookieJar()))\n    client.addheaders = [('User-Agent', 'Mozilla/5.0')]\n    with client.open(BASE + '/login/', timeout=20) as r:\n        soup = BeautifulSoup(r.read(), 'html.parser')\n    csrf = soup.select_one('input[name=\"csrfmiddlewaretoken\"]')\n    if not csrf:\n        raise RuntimeError('Login form token not found')\n    data = url.urlencode({'username': email, 'password': password,\n        'csrfmiddlewaretoken': csrf['value'], 'next': '/announcements/'}).encode()\n    req = web.Request(BASE + '/login/', data=data, headers={'Referer': BASE + '/login/'})\n    with client.open(req, timeout=20) as r:\n        r.read()\n    with client.open(BASE + '/announcements/', timeout=20) as r:\n        if url.urlparse(r.url).path != '/announcements/' or b'Latest Announcements' not in r.read():\n            raise RuntimeError('Screener login was not confirmed')\n    print('LOGIN: PASS', flush=True)\n    summary = ['# Market Pulse access check', '',\n               '| Section | Access | Table rows | Filing links |',\n               '|---|---|---:|---:|']\n    verified = 0\n    for name, path in SOURCES:\n        print('\\nSECTION: ' + name, flush=True)\n        try:\n            with client.open(BASE + path, timeout=15) as r:\n                final_path = url.urlparse(r.url).path\n                if final_path != url.urlparse(path).path:\n                    raise RuntimeError('Redirected away from requested section; access not confirmed')\n                info = describe(r.read())\n            rows = sum(t['rows'] for t in info['tables'])\n            recognised = bool(info['title']) and (bool(info['tables']) or info['documents'] > 0 or info['empty_message'])\n            status = 'PASS' if recognised else 'LAYOUT CHECK NEEDED'\n            verified += int(recognised)\n            print('ACCESS: ' + status, flush=True)\n            print(json.dumps(info, ensure_ascii=False), flush=True)\n            summary.append(f'| {name} | {status} | {rows} | {info[\"documents\"]} |')\n        except Exception as error:\n            # Never log raw exception strings: network URLs may contain sensitive parameters.\n            code = ' HTTP ' + str(error.code) if isinstance(error, urllib.error.HTTPError) else ''\n            status = type(error).__name__ + code\n            print('ACCESS: FAILED - ' + status, flush=True)\n            summary.append(f'| {name} | {status} | - | - |')\n        time.sleep(1)\n    print(f'\\nCHECK FINISHED: {verified}/{len(SOURCES)} section layouts recognised.', flush=True)\n    print('READ-ONLY CHECK: No Telegram messages sent. Existing automation unchanged.', flush=True)\n    summary.extend(['', 'This check does not enable alerts or send Telegram messages.',\n                    'PASS means a section loaded with a table or filing links; it does not prove complete coverage.'])\n    if os.environ.get('GITHUB_STEP_SUMMARY'):\n        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:\n            f.write('\\n'.join(summary) + '\\n')\n\n\nif __name__ == '__main__':\n    try:\n        main()\n    except Exception as error:\n        print('CHECK FAILED: ' + type(error).__name__, flush=True)\n        raise SystemExit(1)\n"
