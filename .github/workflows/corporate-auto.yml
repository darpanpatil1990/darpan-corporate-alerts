    name: Company FII and DII ownership
    needs: market_pulse
    if: always() && !cancelled() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Read repository scanner
      uses: actions/checkout@v4
    - name: Install HTML reader
      run: python -m pip install --quiet beautifulsoup4==4.14.3
    - name: Scan company quarterly ownership and send Telegram alerts
      env:
        GH_TOKEN: ${{ github.token }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        HOLDINGS_BATCH_SIZE: '25'
      run: python company_holdings.py
